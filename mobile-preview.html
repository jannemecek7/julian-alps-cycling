<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JAE mobile preview</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:#171a18;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }
    .phone{
      width:390px;
      height:844px;
      max-width:100vw;
      max-height:100vh;
      border:12px solid #090a09;
      border-radius:42px;
      overflow:hidden;
      box-shadow:0 28px 90px rgba(0,0,0,.5);
      background:#fff
    }
    iframe{width:100%;height:100%;border:0;background:#fff;display:block}
    @media(max-width:520px){
      .phone{width:100vw;height:100vh;border:0;border-radius:0}
    }
  </style>
</head>
<body>
  <div class="phone">
    <iframe src="./index-preview.html" title="Mobile preview"></iframe>
  </div>
</body>
</html>
